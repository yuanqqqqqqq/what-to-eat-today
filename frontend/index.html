<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么</title>
<style>
  :root {
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --soft: #F4F3EF;
    --hover: #EFEEE9;
    --entry-bg: #FFFBF5;

    --t1: #1F1E1B;
    --t2: #6B6862;
    --t3: #9B978F;

    --line: #EDEBE5;
    --line2: #E2DFD8;

    --accent: #C8622B;
    --accent-soft: #FBF0E9;
    --accent-hover: #B5561F;

    --r-lg: 16px;
    --r-md: 10px;
    --r-sm: 6px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--t1);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .page { max-width: 1240px; margin: 0 auto; padding: 40px 32px 80px; }
  @media (max-width: 700px) { .page { padding: 24px 16px 48px; } }

  /* ========== 顶栏 ========== */
  .topbar { margin-bottom: 28px; }
  .topbar h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar p { font-size: 13px; color: var(--t2); margin-top: 2px; }

  /* ========== 入口面板 ========== */
  .entry-panel {
    background: var(--entry-bg);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 24px 28px;
    margin-bottom: 24px;
  }
  .entry-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .entry-head h2 { font-size: 18px; font-weight: 600; color: var(--t1); }
  .advanced-toggle {
    background: transparent; border: none; font-size: 13px; color: var(--t2);
    cursor: pointer; padding: 4px 8px; border-radius: var(--r-sm); transition: all 0.15s;
  }
  .advanced-toggle:hover { color: var(--accent); background: var(--accent-soft); }
  .advanced-toggle .arrow { display: inline-block; transition: transform 0.2s; font-size: 10px; margin-left: 2px; }
  .advanced-toggle.open .arrow { transform: rotate(180deg); }

  .entry-body { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }

  .scene-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .scene-pill {
    padding: 8px 16px; background: var(--card); border: 1px solid var(--line2);
    border-radius: 24px; font-size: 13px; font-weight: 500; color: var(--t1);
    cursor: pointer; transition: all 0.15s;
  }
  .scene-pill:hover { border-color: var(--accent); color: var(--accent); }
  .scene-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .entry-controls { margin-left: auto; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .counter { display: flex; align-items: center; gap: 8px; }
  .counter-label { font-size: 13px; color: var(--t2); font-weight: 500; }
  .counter-ctrl { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line2); border-radius: var(--r-sm); overflow: hidden; }
  .counter-ctrl button {
    width: 28px; height: 30px; background: transparent; border: none; cursor: pointer;
    font-size: 14px; color: var(--t2); transition: background 0.15s;
  }
  .counter-ctrl button:hover { background: var(--soft); color: var(--t1); }
  .counter-ctrl input {
    width: 32px; height: 30px; text-align: center; border: none; background: transparent;
    font-size: 14px; font-weight: 600; color: var(--t1); outline: none;
  }

  .btn-generate {
    padding: 10px 22px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--r-sm); font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; white-space: nowrap;
  }
  .btn-generate:hover { background: var(--accent-hover); }
  .btn-generate:disabled { opacity: 0.6; cursor: default; }

  /* 场景提示 */
  .scene-hint { margin-top: 14px; font-size: 12px; color: var(--t2); min-height: 18px; }
  .scene-hint b { color: var(--accent); font-weight: 600; }

  /* 高级配置 */
  .advanced-panel { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); display: none; }
  .advanced-panel.open { display: block; }
  .adv-group { margin-bottom: 16px; }
  .adv-group:last-child { margin-bottom: 0; }
  .adv-label { display: block; font-size: 12px; font-weight: 500; color: var(--t2); margin-bottom: 8px; letter-spacing: 0.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 12px; font-size: 12px; color: var(--t2); background: var(--soft);
    border: 1px solid transparent; border-radius: var(--r-sm); cursor: pointer; transition: all 0.12s;
  }
  .chip:hover { background: var(--hover); color: var(--t1); }
  .chip.selected { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 500; }

  .adv-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 120px; }
  .field label { display: block; font-size: 12px; color: var(--t2); margin-bottom: 6px; font-weight: 500; }
  .field input, .field select {
    width: 100%; padding: 7px 10px; font-size: 13px; color: var(--t1);
    border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--card); outline: none; transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t2); cursor: pointer; }
  .check-row input { accent-color: var(--accent); }

  /* ========== 主体双栏 ========== */
  .main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
  @media (max-width: 1024px) { .main-grid { grid-template-columns: 1fr; } }

  .main-panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px 28px; }

  .view-tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .view-tab {
    padding: 10px 4px; margin-right: 20px; background: transparent; border: none;
    font-size: 14px; color: var(--t2); cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.15s; font-weight: 500;
  }
  .view-tab:hover { color: var(--t1); }
  .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .disclosure {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--t2);
    cursor: pointer; padding: 6px 0; background: transparent; border: none; margin-bottom: 16px;
  }
  .disclosure:hover { color: var(--accent); }
  .disclosure .arrow { font-size: 9px; transition: transform 0.2s; }
  .disclosure.open .arrow { transform: rotate(90deg); }
  .disclose-body { display: none; margin-bottom: 20px; }
  .disclose-body.open { display: block; }

  .plan-summary {
    padding: 16px 20px; background: var(--entry-bg); border-radius: var(--r-md);
    font-size: 14px; line-height: 1.75; color: var(--t1); margin-bottom: 20px; border-left: 3px solid var(--accent);
  }
  .summary-meta { font-size: 12px; color: var(--t2); margin-top: 8px; }
  .summary-meta b { color: var(--t1); font-weight: 600; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--t3); font-size: 14px; }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }

  /* 菜品网格 */
  .dish-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 900px) { .dish-grid { grid-template-columns: 1fr; } }
  .dish-card {
    display: flex; flex-direction: column; padding: 16px; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--r-md); transition: all 0.15s;
  }
  .dish-card:hover { border-color: var(--line2); box-shadow: 0 4px 12px rgba(31,30,27,0.06); transform: translateY(-1px); }
  .dish-name { font-size: 15px; font-weight: 600; color: var(--t1); margin-bottom: 6px; }
  .dish-tags { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: var(--r-sm); background: var(--soft); color: var(--t2); font-weight: 500; }
  .tag.accent { background: var(--accent-soft); color: var(--accent); }
  .tag.veg { background: #EDF3EB; color: #5A7F54; }
  .tag.soup { background: #EBF1F5; color: #4A6E85; }
  .dish-meta { font-size: 12px; color: var(--t2); line-height: 1.7; margin-bottom: 14px; flex: 1; }
  .dish-meta .star { color: var(--accent); }
  .dish-actions { display: flex; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .dish-actions.secondary { border-top: none; padding-top: 6px; }
  .action-btn {
    flex: 1; padding: 6px 8px; font-size: 11px; color: var(--t2); background: transparent;
    border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .action-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .action-btn.done { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .dish-actions.secondary .action-btn { color: var(--t3); border-color: transparent; background: transparent; }
  .dish-actions.secondary .action-btn:hover { color: var(--accent); background: var(--soft); }

  /* 弹窗 */
  .modal { position: fixed; inset: 0; background: rgba(31,30,27,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal.hidden { display: none; }
  .modal-card { background: var(--card); border-radius: var(--r-lg); max-width: 560px; width: 100%; max-height: 80vh; overflow: auto; padding: 24px 28px; box-shadow: 0 16px 48px rgba(0,0,0,0.18); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 15px; font-weight: 600; color: var(--t1); }
  .modal-head button { background: transparent; border: none; font-size: 16px; color: var(--t3); cursor: pointer; padding: 4px 8px; border-radius: var(--r-sm); }
  .modal-head button:hover { color: var(--t1); background: var(--soft); }
  .modal-body { font-size: 14px; line-height: 1.9; white-space: pre-wrap; color: var(--t1); }
  .modal-body.spin { color: var(--t3); }

  /* 周计划 */
  .week-summary { padding: 16px 20px; background: var(--entry-bg); border-radius: var(--r-md); margin-bottom: 16px; font-size: 13px; color: var(--t2); line-height: 1.8; }
  .week-summary b { color: var(--t1); font-weight: 600; }
  .day-row { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 10px; }
  .day-row h4 { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
  .day-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .day-chip { font-size: 12px; padding: 4px 10px; background: var(--soft); border: none; border-radius: var(--r-sm); color: var(--t1); cursor: pointer; transition: all 0.12s; }
  .day-chip:hover { background: var(--hover); }

  /* 采购 / 营养 / 做法 */
  .zone { margin-bottom: 14px; }
  .zone h4 { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
  .zone ul { list-style: none; }
  .zone li { font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); color: var(--t1); }
  .zone li .amt { color: var(--t3); font-size: 12px; }
  .nutri-strip { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
  .nutri-strip .k { color: var(--t2); }
  .nutri-strip .v { font-weight: 600; }
  .tips { font-size: 13px; color: var(--accent); margin-top: 6px; }
  .step-dish { margin-bottom: 16px; }
  .step-dish h4 { font-size: 14px; margin-bottom: 6px; }
  .step-dish ol { padding-left: 20px; font-size: 13px; color: var(--t1); }
  .step-dish li { margin: 3px 0; }

  /* 编排过程 */
  .trace-line { font-size: 12px; color: var(--t2); padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .trace-line b { color: var(--accent); font-weight: 600; }

  /* 侧栏 */
  .side-col { display: flex; flex-direction: column; gap: 16px; }
  .side-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; }
  .side-title { font-size: 13px; font-weight: 600; color: var(--t1); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .side-title button { background: transparent; border: none; font-size: 12px; color: var(--t2); cursor: pointer; padding: 2px 6px; border-radius: var(--r-sm); transition: all 0.15s; }
  .side-title button:hover { color: var(--accent); }
  .profile-empty { font-size: 13px; color: var(--t3); line-height: 1.6; }
  .pf-line { font-size: 13px; margin-bottom: 10px; }
  .pf-line:last-child { margin-bottom: 0; }
  .pf-line .pf-label { color: var(--t2); font-size: 12px; display: block; margin-bottom: 4px; }
  .pf-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .pf-chip { font-size: 12px; padding: 2px 9px; border-radius: var(--r-sm); background: var(--soft); color: var(--t1); }
  .pf-chip.avoid { background: var(--accent-soft); color: var(--accent); }

  .reuse-input-row { display: flex; gap: 8px; }
  .reuse-input-row input { flex: 1; padding: 7px 10px; font-size: 13px; border: 1px solid var(--line2); border-radius: var(--r-sm); outline: none; }
  .reuse-input-row input:focus { border-color: var(--accent); }
  .reuse-input-row button { padding: 7px 12px; background: var(--accent); color: #fff; border: none; border-radius: var(--r-sm); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .reuse-item { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; margin-top: 10px; }
  .reuse-item h5 { font-size: 13px; color: var(--accent); font-weight: 600; }
  .reuse-item p { font-size: 12px; color: var(--t2); margin-top: 4px; line-height: 1.6; }

  /* Toast */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--t1); color: #fff; padding: 9px 18px; border-radius: 22px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <h1>今天吃什么</h1>
    <p>从"不知道吃什么"到"菜端上桌"，约束内随机，帮你一次搞定</p>
  </header>

  <!-- 入口面板 -->
  <section class="entry-panel">
    <div class="entry-head">
      <h2>今天想吃什么？</h2>
      <button class="advanced-toggle" id="advToggle">高级配置 <span class="arrow">▾</span></button>
    </div>

    <div class="entry-body">
      <div class="scene-pills" id="scenePills"></div>
      <div class="entry-controls">
        <div class="counter" id="peopleCounter">
          <span class="counter-label">人数</span>
          <div class="counter-ctrl">
            <button data-step="-1">−</button>
            <input type="text" value="3" readonly>
            <button data-step="1">+</button>
          </div>
        </div>
        <div class="counter" id="dishCounter">
          <span class="counter-label">菜</span>
          <div class="counter-ctrl">
            <button data-step="-1">−</button>
            <input type="text" value="2" readonly>
            <button data-step="1">+</button>
          </div>
        </div>
        <div class="counter" id="soupCounter">
          <span class="counter-label">汤</span>
          <div class="counter-ctrl">
            <button data-step="-1">−</button>
            <input type="text" value="1" readonly>
            <button data-step="1">+</button>
          </div>
        </div>
        <div class="counter" id="dayCounter" style="display:none">
          <span class="counter-label">天数</span>
          <div class="counter-ctrl">
            <button data-step="-1">−</button>
            <input type="text" value="7" readonly>
            <button data-step="1">+</button>
          </div>
        </div>
        <button class="btn-generate" id="btnGenerate">生成方案 →</button>
      </div>
    </div>

    <div class="scene-hint" id="sceneHint"></div>

    <div class="advanced-panel" id="advPanel">
      <div class="adv-group">
        <label class="adv-label">忌口（硬约束）</label>
        <div class="chips" id="tabooChips"></div>
      </div>
      <div class="adv-group">
        <label class="adv-label">过敏（硬约束）</label>
        <div class="chips" id="allergyChips"></div>
      </div>
      <div class="adv-group">
        <label class="adv-label">口味偏好（软约束）</label>
        <div class="chips" id="tasteChips"></div>
      </div>
      <div class="adv-group">
        <label class="adv-label">厨房设备</label>
        <div class="chips" id="deviceChips"></div>
      </div>
      <div class="adv-group">
        <label class="adv-label">其他约束</label>
        <div class="adv-row">
          <div class="field">
            <label>预算（元 / 整桌）</label>
            <input type="number" id="budget" placeholder="不限">
          </div>
          <div class="field">
            <label>时间（分钟）</label>
            <select id="timeBudget">
              <option value="">不限</option>
              <option value="20">20 分钟内</option>
              <option value="30">30 分钟内</option>
              <option value="60">60 分钟内</option>
              <option value="90">90 分钟内</option>
            </select>
          </div>
          <div class="field">
            <label>难度上限</label>
            <select id="maxDifficulty">
              <option value="">不限</option>
              <option value="1">★ 极简</option>
              <option value="2">★★ 简单</option>
              <option value="3">★★★ 中等</option>
              <option value="4">★★★★ 挑战</option>
              <option value="5">★★★★★ 硬核</option>
            </select>
          </div>
          <div class="field">
            <label>营养目标</label>
            <select id="nutritionGoal">
              <option value="">无</option>
              <option>均衡</option>
              <option>减脂</option>
              <option>增肌</option>
              <option>控糖</option>
            </select>
          </div>
        </div>
      </div>
      <div class="adv-group">
        <label class="adv-label">家里现有食材（优先消耗，逗号分隔）</label>
        <div class="adv-row"><div class="field" style="min-width:280px"><input type="text" id="pantry" placeholder="如：鸡蛋, 西红柿"></div></div>
      </div>
      <div class="adv-group">
        <label class="check-row"><input type="checkbox" id="useGraph" checked> 多 Agent 编排（营养师不达标会自动回退重选）</label>
      </div>
    </div>
  </section>

  <!-- 主体双栏 -->
  <div class="main-grid">
    <main class="main-panel">
      <div class="view-tabs">
        <button class="view-tab active" data-view="meal">今日一餐</button>
        <button class="view-tab" data-view="weekly">一周菜单</button>
      </div>

      <div id="resultArea">
        <div class="empty-state">
          <div class="big">🍳</div>
          选好场景，点「生成方案」<br>给你一桌惊喜但不离谱的搭配
        </div>
      </div>
    </main>

    <aside class="side-col">
      <div class="side-card">
        <div class="side-title">家庭味觉画像 <button id="refreshProfile">刷新</button></div>
        <div id="profileBody" class="profile-empty">加载中…</div>
      </div>
      <div class="side-card">
        <div class="side-title">剩菜再利用</div>
        <div class="reuse-input-row">
          <input type="text" id="reuseInput" placeholder="输入剩的菜名，如：红烧肉">
          <button id="reuseGo">找做法</button>
        </div>
        <div id="reuseResult"></div>
      </div>
    </aside>
  </div>
</div>

<div id="toast"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><span id="modalTitle">家常简化版做法</span><button id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
let META = null;
let view = 'meal';          // meal | weekly
let currentScene = null;
let currentPeople = 3;
let currentSeed = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 元数据加载 ---------- */
async function loadMeta() {
  META = await (await fetch('/api/meta')).json();
  renderScenePills(META.scenes || []);
  renderChips($('tabooChips'), META.taboos);
  renderChips($('allergyChips'), META.allergies);
  renderChips($('tasteChips'), META.tastes);
  renderChips($('deviceChips'), META.devices);
  loadProfile();
}

function renderScenePills(scenes) {
  const el = $('scenePills');
  el.innerHTML = '';
  scenes.forEach(s => {
    const b = document.createElement('button');
    b.className = 'scene-pill';
    b.textContent = `${s.icon || ''} ${s.name}`;
    b.onclick = () => applyScene(s, b);
    el.appendChild(b);
  });
}

function renderChips(el, items) {
  el.innerHTML = '';
  (items || []).forEach(it => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = it;
    c.onclick = () => c.classList.toggle('selected');
    el.appendChild(c);
  });
}

function getSelected(el) { return [...el.querySelectorAll('.chip.selected')].map(c => c.textContent); }

/* ---------- 场景 ---------- */
function applyScene(s, el) {
  if (currentScene === s.id) {
    currentScene = null;
    document.querySelectorAll('.scene-pill').forEach(x => x.classList.remove('active'));
    $('sceneHint').innerHTML = '';
    toast('已取消场景预设');
    return;
  }
  currentScene = s.id;
  document.querySelectorAll('.scene-pill').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  const d = s.defaults || {};
  if (d.dishes !== undefined) setCounter('dishCounter', d.dishes, 0, 10);
  if (d.soups !== undefined) setCounter('soupCounter', d.soups, 0, 5);
  if (d.time_budget !== undefined) $('timeBudget').value = d.time_budget ?? '';
  if (d.max_difficulty !== undefined) $('maxDifficulty').value = d.max_difficulty ?? '';
  if (d.nutrition_goal !== undefined) $('nutritionGoal').value = d.nutrition_goal ?? '';
  $('sceneHint').innerHTML = `已应用 <b>${esc(s.name)}</b>：${esc(s.desc || '')}`;
}

/* ---------- 计数器 ---------- */
function bindCounter(id, min, max) {
  const ctrl = $(id).querySelector('.counter-ctrl');
  const input = ctrl.querySelector('input');
  ctrl.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      let v = parseInt(input.value) + parseInt(btn.dataset.step);
      v = Math.max(min, Math.min(max, v));
      input.value = v;
      if (id === 'peopleCounter') currentPeople = v;
    };
  });
}
function setCounter(id, v, min, max) {
  const input = $(id).querySelector('input');
  input.value = Math.max(min, Math.min(max, v));
  if (id === 'peopleCounter') currentPeople = input.value | 0;
}

/* ---------- 高级配置展开 ---------- */
$('advToggle').onclick = () => {
  $('advToggle').classList.toggle('open');
  $('advPanel').classList.toggle('open');
};

/* ---------- Tab 切换 ---------- */
document.querySelectorAll('.view-tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.view-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    view = t.dataset.view;
    // 周计划：隐藏菜/汤，显示天数
    const weekly = view === 'weekly';
    $('dishCounter').style.display = weekly ? 'none' : '';
    $('soupCounter').style.display = weekly ? 'none' : '';
    $('dayCounter').style.display = weekly ? '' : 'none';
    $('resultArea').innerHTML = emptyHTML(weekly ? '一周不重样，顺便把整周采购清单算好' : '选好场景，点「生成方案」');
  };
});

function emptyHTML(hint) {
  return `<div class="empty-state"><div class="big">🍳</div>${esc(hint)}</div>`;
}

/* ---------- 组装请求 ---------- */
function buildReq() {
  return {
    people: currentPeople,
    dishes: +($('dishCounter').querySelector('input').value) || 0,
    soups: +($('soupCounter').querySelector('input').value) || 0,
    taboos: getSelected($('tabooChips')),
    allergies: getSelected($('allergyChips')),
    taste_prefs: getSelected($('tasteChips')),
    devices: getSelected($('deviceChips')),
    budget: $('budget').value ? +$('budget').value : null,
    time_budget: $('timeBudget').value ? +$('timeBudget').value : null,
    max_difficulty: $('maxDifficulty').value ? +$('maxDifficulty').value : null,
    nutrition_goal: $('nutritionGoal').value || null,
    pantry: $('pantry').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean),
    scene_id: currentScene,
  };
}

/* ---------- 生成 ---------- */
async function generate() {
  const btn = $('btnGenerate');
  btn.disabled = true;
  btn.textContent = '生成中…';
  currentSeed = Math.floor(Math.random() * 1e9);

  try {
    let url, body;
    if (view === 'weekly') {
      url = '/api/weekly';
      body = Object.assign({}, buildReq(), { days: +($('dayCounter').querySelector('input').value) || 7, seed: currentSeed });
    } else if ($('useGraph').checked) {
      url = '/api/plan/graph';
      body = Object.assign({}, buildReq(), { seed: currentSeed });
    } else {
      url = '/api/recommend';
      body = Object.assign({}, buildReq(), { seed: currentSeed });
    }
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json();
    if (data.ok === false) { $('resultArea').innerHTML = emptyHTML(data.error || '没有符合条件的菜，试试放宽约束'); return; }
    if (view === 'weekly') renderWeekly(data); else renderMeal(data);
  } catch (e) {
    $('resultArea').innerHTML = emptyHTML('请求失败：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '生成方案 →';
  }
}

$('btnGenerate').onclick = generate;

/* ---------- 菜品卡 ---------- */
function typeClass(t) { return t === '素' ? 'veg' : t === '汤' ? 'soup' : ''; }

function dishCard(r) {
  const perPerson = currentPeople > 0 ? Math.round((r.calories_kcal || 0) / currentPeople) : 0;
  return `
    <div class="dish-card">
      <div class="dish-name">${esc(r.name)}</div>
      <div class="dish-tags">
        <span class="tag ${typeClass(r.dish_type)}">${esc(r.dish_type || '')}</span>
        ${r.spiciness ? `<span class="tag">${esc(r.spiciness)}</span>` : ''}
      </div>
      <div class="dish-meta">
        ${(r.taste || []).join(' · ') || ''}${(r.taste || []).length ? ' · ' : ''}时令 ${esc(r.season || '四季')}<br>
        <span class="star">${'★'.repeat(r.difficulty || 0)}</span> · ${r.estimated_minutes ? r.estimated_minutes + ' 分钟' : '耗时未知'} · 整盘 ${r.calories_kcal} 大卡${perPerson ? `（人均 ${perPerson}）` : ''}
      </div>
      <div class="dish-actions">
        <button class="action-btn like" data-id="${esc(r.id)}">👍 喜欢</button>
        <button class="action-btn dislike" data-id="${esc(r.id)}">👎 不喜欢</button>
      </div>
      <div class="dish-actions secondary">
        <button class="action-btn reuse" data-name="${esc(r.name)}">♻ 再加工</button>
        <button class="action-btn simplify" data-name="${esc(r.name)}">🪄 简化做法</button>
      </div>
    </div>`;
}

/* ---------- 渲染：今日一餐 ---------- */
function renderMeal(d) {
  let html = '';
  if (d.agent_trace && d.agent_trace.length) {
    html += disclosure('agentTrace', '查看多 Agent 编排过程',
      d.agent_trace.map(t => `<div class="trace-line"><b>${esc(t.agent)}</b>：${esc(t.note)}</div>`).join(''));
  }

  const perPerson = d.nutrition ? d.nutrition.per_person_kcal : 0;
  let meta = `共 ${d.menu.length} 道 · 人均 ${perPerson} 大卡 · 估算 ${d.shopping ? d.shopping.est_cost_yuan : 0} 元`;
  if (d.info && d.info.fallback) meta += ' · <b style="color:#C8622B">约束太紧，已给最接近的方案</b>';
  html += `<div class="plan-summary">${esc(d.pairing_note || '')}<div class="summary-meta">${meta}</div></div>`;

  html += `<div class="dish-grid">${d.menu.map(dishCard).join('')}</div>`;

  html += disclosure('detail', '采购清单 & 营养 & 分步做法',
    (d.shopping ? renderShopping(d.shopping) : '') + renderNutrition(d.nutrition) + renderSteps(d.menu));

  $('resultArea').innerHTML = html;
}

/* ---------- 渲染：一周菜单 ---------- */
function renderWeekly(d) {
  const s = d.summary || {};
  let html = `<div class="week-summary">
    共 <b>${s.days}</b> 天 · <b>${s.total_dishes}</b> 道菜（<b>${s.unique_dishes}</b> 道不重样） ·
    荤 <b>${s.meat}</b> / 素 <b>${s.veg}</b> / 汤 <b>${s.soup}</b> ·
    整周估算 <b>${d.week_shopping ? d.week_shopping.est_cost_yuan : 0}</b> 元
  </div>`;

  html += (d.days || []).map(day => `
    <div class="day-row">
      <h4>第 ${day.day} 天</h4>
      <div class="day-chips">
        ${day.menu && day.menu.length
          ? day.menu.map(r => `<button class="day-chip" data-name="${esc(r.name)}">${esc(r.name)}</button>`).join('')
          : `<span class="tips">${esc(day.error || '无结果')}</span>`}
      </div>
    </div>`).join('');

  html += disclosure('weekDetail', '整周采购清单', d.week_shopping ? renderShopping(d.week_shopping) : '');

  $('resultArea').innerHTML = html;
}

function disclosure(id, title, body) {
  return `<button class="disclosure" data-toggle="${id}"><span class="arrow">▶</span><span>${esc(title)}</span></button>
          <div class="disclose-body" id="${id}">${body}</div>`;
}

function renderShopping(shopping) {
  return shopping.zones.map(z => `
    <div class="zone"><h4>${esc(z.zone)}</h4><ul>
      ${z.items.map(it => `<li>${esc(it.name)}${it.optional ? ' <span class="amt">(可选)</span>' : ''} <span class="amt">${it.amount ? '· ' + esc(it.amount) : ''}${it.used_by.length > 1 ? ' · 共 ' + it.used_by.length + ' 道菜用' : ''}</span></li>`).join('')}
    </ul></div>`).join('');
}

function renderNutrition(n) {
  if (!n) return '';
  return `<div class="zone"><h4>营养粗估</h4>
    <div class="nutri-strip">
      <span><span class="k">总热量</span> <span class="v">${n.total_kcal}</span> 大卡</span>
      <span><span class="k">人均</span> <span class="v">${n.per_person_kcal}</span> 大卡</span>
      <span><span class="k">荤/素/汤</span> <span class="v">${n.meat_count}/${n.veg_count}/${n.soup_count}</span></span>
    </div>
    ${(n.tips || []).map(t => `<div class="tips">${esc(t)}</div>`).join('')}
  </div>`;
}

function renderSteps(menu) {
  if (!menu || !menu.length) return '';
  return `<div class="zone"><h4>分步做法</h4>` + menu.map(r => `
    <div class="step-dish">
      <h4>${esc(r.name)}</h4>
      ${(r.steps || []).map(g => (g.group ? `<h4 style="font-size:12px;color:var(--t2);margin-top:6px">${esc(g.group)}</h4>` : '') +
        `<ol>${(g.steps || []).map(s => `<li>${esc(s.text)}</li>`).join('')}</ol>`).join('')}
      ${(r.tips || []).length ? `<div class="tips">${r.tips.map(esc).join('；')}</div>` : ''}
    </div>`).join('') + `</div>`;
}

/* ---------- 事件委托：折叠 / 反馈 / 再加工 ---------- */
$('resultArea').addEventListener('click', e => {
  const dis = e.target.closest('.disclosure');
  if (dis) {
    dis.classList.toggle('open');
    const body = document.getElementById(dis.dataset.toggle);
    if (body) body.classList.toggle('open');
    return;
  }
  const like = e.target.closest('.action-btn.like');
  if (like) { sendFeedback(like.dataset.id, 1); like.classList.add('done'); return; }
  const dislike = e.target.closest('.action-btn.dislike');
  if (dislike) { sendFeedback(dislike.dataset.id, -1); dislike.classList.add('done'); return; }
  const reuse = e.target.closest('.action-btn.reuse, .day-chip');
  if (reuse) { doReuse(reuse.dataset.name); return; }
  const simplify = e.target.closest('.action-btn.simplify');
  if (simplify) { doSimplify(simplify.dataset.name); return; }
});

/* ---------- 简化做法 ---------- */
function openModal(title, bodyHTML, spin) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHTML;
  $('modalBody').classList.toggle('spin', !!spin);
  $('modal').classList.remove('hidden');
}
$('modalClose').onclick = () => $('modal').classList.add('hidden');
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').classList.add('hidden'); });

async function doSimplify(name) {
  openModal(`家常简化版 · ${name}`, '正在让老师傅改写做法…', true);
  try {
    const d = await (await fetch('/api/simplify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ recipe_name: name }) })).json();
    if (d.ok) {
      openModal(`家常简化版 · ${name}`, esc(d.simplified));
    } else {
      openModal('生成失败', `<div class="tips">${esc(d.error || '无法生成简化做法')}</div>`);
    }
  } catch (e) {
    openModal('请求失败', `<div class="tips">${esc(e.message)}</div>`);
  }
}

/* ---------- 反馈 & 画像 ---------- */
async function sendFeedback(id, v) {
  try {
    const r = await (await fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ recipe_id: id, feedback: v }) })).json();
    if (r.ok) { toast(v > 0 ? '已记住：喜欢这道' : '已记住：不喜欢这道'); loadProfile(); }
  } catch (e) { toast('反馈失败'); }
}

async function loadProfile() {
  try {
    const p = await (await fetch('/api/profile')).json();
    renderProfile(p);
  } catch (e) { $('profileBody').innerHTML = '<div class="profile-empty">加载失败</div>'; }
}
$('refreshProfile').onclick = loadProfile;

function renderProfile(p) {
  if (!p.count) {
    $('profileBody').innerHTML = `<div class="profile-empty">还没记录过。点菜卡上的「喜欢 / 不喜欢」，慢慢积累属于你家的口味画像。</div>`;
    return;
  }
  const chips = (arr, cls) => arr && arr.length
    ? arr.map(x => `<span class="pf-chip ${cls}">${esc(x.name)}</span>`).join('')
    : '<span class="pf-chip">暂无</span>';
  $('profileBody').innerHTML = `
    <div class="pf-line">已记录 <b>${p.count}</b> 次</div>
    <div class="pf-line"><span class="pf-label">爱吃的口味</span><div class="pf-chips">${chips(p.top_tastes)}</div></div>
    <div class="pf-line"><span class="pf-label">偏爱食材</span><div class="pf-chips">${chips(p.top_ingredients)}</div></div>
    <div class="pf-line"><span class="pf-label">想避开</span><div class="pf-chips">${chips(p.avoid_ingredients, 'avoid')}</div></div>
    <div class="pf-line"><span class="pf-label">常点爱吃的菜</span><div class="pf-chips">${chips(p.top_dishes)}</div></div>`;
}

/* ---------- 剩菜再利用 ---------- */
async function doReuse(name) {
  $('reuseInput').value = name;
  $('reuseResult').innerHTML = '<div class="tips" style="margin-top:10px">正在找二次加工做法…</div>';
  try {
    const d = await (await fetch('/api/leftover', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ recipe_name: name, n: 3 }) })).json();
    if (d.error) { $('reuseResult').innerHTML = `<div class="tips" style="margin-top:10px">${esc(d.error)}</div>`; return; }
    $('reuseResult').innerHTML = (d.suggestions || []).map(s => `
      <div class="reuse-item">
        <h5>→ ${esc(s.recipe.name)}</h5>
        <p>${esc(s.how)}</p>
      </div>`).join('') || '<div class="tips" style="margin-top:10px">没找到合适的二次加工，换个菜名试试。</div>';
    $('reuseResult').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) { $('reuseResult').innerHTML = `<div class="tips" style="margin-top:10px">请求失败：${esc(e.message)}</div>`; }
}
$('reuseGo').onclick = () => { const v = $('reuseInput').value.trim(); if (v) doReuse(v); };
$('reuseInput').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = $('reuseInput').value.trim(); if (v) doReuse(v); } });

/* ---------- 初始化 ---------- */
bindCounter('peopleCounter', 1, 20);
bindCounter('dishCounter', 0, 10);
bindCounter('soupCounter', 0, 5);
bindCounter('dayCounter', 3, 14);
loadMeta();
</script>
</body>
</html>
