<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么</title>
<style>
  :root {
    /* 配色：纸白底 + 墨字 + 葱绿强调（来自食材语域，避开陶土色） */
    --bg: #F7F4EE;
    --card: #FFFFFF;
    --soft: #F1EFE8;
    --hover: #EAE7DD;
    --entry-bg: #FBF9F1;

    --t1: #2A2722;
    --t2: #6E6A61;
    --t3: #A09B8F;

    --line: #E9E5DA;
    --line2: #DBD6C9;

    --accent: #4A6B3A;
    --accent-soft: #EDF1E5;
    --accent-hover: #3C572E;

    --r-lg: 16px;
    --r-md: 10px;
    --r-sm: 6px;

    /* 字体：宋体做菜名/标题（菜单的主角），无衬线做 UI */
    --serif: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;

    /* 动效 tokens（克制 + 强缓动曲线） */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --dur-fast: 120ms;
    --dur-base: 160ms;
    --dur-slow: 250ms;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--t1);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  /* 键盘焦点可见（质量底线，勿移除） */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .page { max-width: 1240px; margin: 0 auto; padding: 40px 32px 80px; }
  @media (max-width: 700px) {
    .page { padding: 24px 16px 48px; }
    /* 移动端入口面板：纵向堆叠，按钮全宽 */
    .entry-body { flex-direction: column; align-items: stretch; gap: 16px; }
    .entry-controls { margin-left: 0; justify-content: space-between; }
    .btn-generate { width: 100%; }
    .counter-ctrl button { width: 36px; height: 36px; }
    .counter-ctrl input { width: 36px; height: 36px; }
  }

  /* ========== 顶栏 ========== */
  .topbar { margin-bottom: 28px; }
  .topbar h1 { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: 0.01em; }
  .topbar p { font-size: 13px; color: var(--t2); margin-top: 4px; }

  /* ========== 入口面板 ========== */
  .entry-panel {
    background: var(--entry-bg);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 24px 28px;
    margin-bottom: 24px;
  }
  .entry-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .entry-head h2 { font-size: 18px; font-weight: 600; color: var(--t1); }
  .advanced-toggle {
    background: transparent; border: none; font-size: 13px; color: var(--t2);
    cursor: pointer; padding: 4px 8px; border-radius: var(--r-sm); transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  }
  .advanced-toggle:hover { color: var(--accent); background: var(--accent-soft); }
  .advanced-toggle .arrow { display: inline-block; transition: transform var(--dur-slow) var(--ease-out); font-size: 10px; margin-left: 2px; }
  .advanced-toggle.open .arrow { transform: rotate(180deg); }

  .entry-body { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }

  .scene-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .scene-pill {
    padding: 8px 16px; background: var(--card); border: 1px solid var(--line2);
    border-radius: 24px; font-size: 13px; font-weight: 500; color: var(--t1);
    cursor: pointer; transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  }
  .scene-pill:hover { border-color: var(--accent); color: var(--accent); }
  .scene-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .entry-controls { margin-left: auto; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .counter { display: flex; align-items: center; gap: 8px; }
  .counter-label { font-size: 13px; color: var(--t2); font-weight: 500; }
  .counter-ctrl { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line2); border-radius: var(--r-sm); overflow: hidden; }
  .counter-ctrl button {
    width: 28px; height: 30px; background: transparent; border: none; cursor: pointer;
    font-size: 14px; color: var(--t2); transition: background-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  }
  .counter-ctrl button:hover { background: var(--soft); color: var(--t1); }
  .counter-ctrl input {
    width: 32px; height: 30px; text-align: center; border: none; background: transparent;
    font-size: 14px; font-weight: 600; color: var(--t1); outline: none;
  }
  .counter-ctrl input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn-generate {
    padding: 10px 22px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--r-sm); font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); white-space: nowrap;
  }
  .btn-generate:hover { background: var(--accent-hover); }
  .btn-generate:disabled { opacity: 0.6; cursor: default; }

  /* 关键约束常驻区（忌口/过敏/预算/现成食材） */
  .quick-constraints {
    margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 14px;
  }
  .quick-constraints .adv-group { margin-bottom: 0; }

  /* 场景提示 */
  .scene-hint { margin-top: 14px; font-size: 12px; color: var(--t2); min-height: 18px; }
  .scene-hint b { color: var(--accent); font-weight: 600; }
  .llm-actions { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .llm-status { font-size: 12px; color: var(--t2); }
  .llm-hint { font-size: 12px; color: var(--t3); margin-top: 8px; line-height: 1.7; }

  /* 高级配置 */
  .advanced-panel { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); display: none; }
  .advanced-panel.open { display: block; }
  .adv-group { margin-bottom: 16px; }
  .adv-group:last-child { margin-bottom: 0; }
  .adv-label { display: block; font-size: 12px; font-weight: 500; color: var(--t2); margin-bottom: 8px; letter-spacing: 0.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 12px; font-size: 12px; color: var(--t2); background: var(--soft);
    border: 1px solid transparent; border-radius: var(--r-sm); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .chip:hover { background: var(--hover); color: var(--t1); }
  .chip.selected { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 500; }

  .adv-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 120px; }
  .field label { display: block; font-size: 12px; color: var(--t2); margin-bottom: 6px; font-weight: 500; }
  .field input, .field select {
    width: 100%; padding: 7px 10px; font-size: 13px; color: var(--t1);
    border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--card); outline: none; transition: border-color var(--dur-base) var(--ease-out);
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t2); cursor: pointer; }
  .check-row input { accent-color: var(--accent); }

  /* ========== 主体双栏 ========== */
  .main-grid { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; }

  .main-panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px 28px; }

  .view-tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .view-tab {
    padding: 10px 4px; margin-right: 20px; background: transparent; border: none;
    font-size: 14px; color: var(--t2); cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); font-weight: 500;
  }
  .view-tab:hover { color: var(--t1); }
  .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .disclosure {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--t2);
    cursor: pointer; padding: 6px 0; background: transparent; border: none; margin-bottom: 16px;
  }
  .disclosure:hover { color: var(--accent); }
  .disclosure .arrow { font-size: 9px; transition: transform var(--dur-slow) var(--ease-out); }
  .disclosure.open .arrow { transform: rotate(90deg); }
  .disclose-body { display: none; margin-bottom: 20px; }
  .disclose-body.open { display: block; }

  .plan-summary {
    padding: 16px 20px; background: var(--entry-bg); border-radius: var(--r-md);
    font-size: 14px; line-height: 1.75; color: var(--t1); margin-bottom: 20px; border-left: 3px solid var(--accent);
  }
  .summary-meta { font-size: 12px; color: var(--t2); margin-top: 8px; }
  .summary-meta b { color: var(--t1); font-weight: 600; }
  .summary-meta b.warn { color: var(--accent); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--t3); font-size: 14px; }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }

  /* 菜品菜单条目（纵向，菜名是主角） */
  .dish-grid { display: flex; flex-direction: column; }
  .dish-card {
    display: grid;
    grid-template-columns: 44px minmax(90px, 170px) 1fr auto;
    grid-template-areas:
      "visual name info actions"
      "visual name info feedback";
    align-items: center; column-gap: 16px; row-gap: 4px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
    transition: background-color var(--dur-base) var(--ease-out);
  }
  .dish-card:last-child { border-bottom: none; }
  .dish-card:hover { background: var(--entry-bg); }
  @keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .dish-card.anim { animation: card-in var(--dur-slow) var(--ease-out) backwards; }
  .dish-visual {
    grid-area: visual; width: 44px; height: 44px; border-radius: 50%;
    background: var(--soft); display: flex; align-items: center; justify-content: center;
    font-size: 22px; line-height: 1;
  }
  .dish-name {
    grid-area: name; font-family: var(--serif); font-size: 18px; font-weight: 600; color: var(--t1);
    line-height: 1.45; cursor: pointer; transition: color var(--dur-fast) var(--ease-out);
  }
  .dish-name:hover { color: var(--accent); }
  .dish-info { grid-area: info; min-width: 0; cursor: pointer; }
  .dish-tags { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: var(--r-sm); background: var(--soft); color: var(--t2); font-weight: 500; }
  .tag.type::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: 1px; }
  .dish-meta { font-size: 12px; color: var(--t2); line-height: 1.7; }
  .dish-meta .star { color: var(--accent); letter-spacing: 1px; }
  .dish-why { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .why-chip {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
  }
  .dish-actions { grid-area: actions; display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
  .action-btn {
    padding: 6px 10px; font-size: 12px; color: var(--t2); background: transparent;
    border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer;
    transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out); white-space: nowrap;
  }
  .action-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .action-btn.done { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .dish-feedback { grid-area: feedback; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .fb-label { font-size: 11px; color: var(--t3); }
  .fb-btn {
    padding: 2px 7px; font-size: 14px; line-height: 1.5; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm);
    filter: grayscale(0.85); opacity: 0.75;
    transition: opacity var(--dur-base) var(--ease-out), filter var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), background-color var(--dur-base) var(--ease-out);
  }
  .fb-btn:hover { opacity: 1; filter: none; border-color: var(--line2); }
  .fb-btn.done { opacity: 1; filter: none; border-color: var(--accent); background: var(--accent-soft); }
  @media (max-width: 700px) {
    .dish-card {
      grid-template-columns: 36px 1fr;
      grid-template-areas:
        "visual name"
        "info info"
        "actions actions"
        "feedback feedback";
      row-gap: 8px;
    }
    .dish-visual { width: 36px; height: 36px; font-size: 18px; }
    .dish-actions { justify-content: flex-start; }
    .dish-feedback { justify-content: flex-start; }
  }

  /* 弹窗 */
  .modal { position: fixed; inset: 0; background: rgba(42,39,34,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; opacity: 0; visibility: hidden; transition: opacity var(--dur-slow) var(--ease-out), visibility 0s var(--dur-slow); }
  /* 做法弹窗要盖在搜菜/加菜弹窗之上 */
  #modal { z-index: 110; }
  .modal:not(.hidden) { opacity: 1; visibility: visible; transition: opacity var(--dur-slow) var(--ease-out); }
  .modal-card { background: var(--card); border-radius: var(--r-lg); max-width: 560px; width: 100%; max-height: 80vh; overflow: auto; padding: 24px 28px; box-shadow: 0 16px 48px rgba(0,0,0,0.18); transform: scale(0.97); transition: transform var(--dur-slow) var(--ease-out); }
  .modal:not(.hidden) .modal-card { transform: scale(1); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 15px; font-weight: 600; color: var(--t1); }
  .modal-head button { background: transparent; border: none; font-size: 15px; color: var(--t3); cursor: pointer; padding: 4px 8px; border-radius: var(--r-sm); }
  .modal-head button:hover { color: var(--t1); background: var(--soft); }
  .modal-body { font-size: 14px; line-height: 1.9; white-space: pre-wrap; color: var(--t1); }
  .modal-body.spin { color: var(--t3); }
  .modal-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .modal-tools .head-btn { white-space: normal; text-align: left; }
  .loading { font-size: 13px; color: var(--t3); padding: 6px 0; }
  .reuse-item { border-bottom: 1px dashed var(--line); padding: 8px 0; }
  .reuse-item:last-child { border-bottom: none; }
  .reuse-name { font-weight: 600; color: var(--t1); font-size: 14px; }
  .reuse-how { font-size: 13px; color: var(--t2); line-height: 1.7; }
  .simplified { font-family: inherit; font-size: 13px; line-height: 1.85; white-space: pre-wrap; color: var(--t1); }

  /* 周计划 */
  .week-summary { padding: 16px 20px; background: var(--entry-bg); border-radius: var(--r-md); margin-bottom: 16px; font-size: 13px; color: var(--t2); line-height: 1.8; }
  .week-summary b { color: var(--t1); font-weight: 600; }
  .day-row { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 10px; }
  .day-row h4 { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .day-tag { font-size: 11px; font-weight: 500; color: var(--t3); background: var(--soft); padding: 1px 7px; border-radius: 8px; }
  .day-tag.warn { color: var(--accent); background: var(--accent-soft); }
  .day-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .day-chip { font-size: 12px; padding: 4px 10px; background: var(--soft); border: none; border-radius: var(--r-sm); color: var(--t1); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .day-chip:hover { background: var(--hover); }

  /* 采购 / 营养 / 做法 */
  .zone { margin-bottom: 14px; }
  .zone h4 { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
  .zone ul { list-style: none; }
  .zone li { font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); color: var(--t1); }
  .zone li .amt { color: var(--t3); font-size: 12px; }
  .nutri-strip { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
  .nutri-strip .k { color: var(--t2); }
  .nutri-strip .v { font-weight: 600; }
  .nutri-macros .v { font-family: var(--serif); font-size: 15px; }
  .nutri-note { font-size: 12px; color: var(--t3); margin: 4px 0 6px; line-height: 1.7; }
  .disclaimer {
    font-size: 12px; color: var(--t3); margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed var(--line); line-height: 1.7;
  }
  .tips { font-size: 13px; color: var(--accent); margin-top: 6px; }
  .step-dish { margin-bottom: 16px; }
  .step-dish h4 { font-size: 14px; margin-bottom: 6px; }
  .step-dish ol { padding-left: 20px; font-size: 13px; color: var(--t1); }
  .step-dish li { margin: 3px 0; }

  /* 编排过程 */
  .trace-line { font-size: 12px; color: var(--t2); padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .trace-line b { color: var(--accent); font-weight: 600; }

  .pf-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .pf-chip { font-size: 12px; padding: 2px 9px; border-radius: var(--r-sm); background: var(--soft); color: var(--t1); }
  .pf-chip.avoid { background: var(--accent-soft); color: var(--accent); }

  /* 菜市场 */
  .market-search, .market-add-form input, .market-add-form select, .market-add-form textarea,
  .market-pantry-add input {
    width: 100%; padding: 7px 10px; font-size: 13px; color: var(--t1);
    border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--card); outline: none;
    transition: border-color var(--dur-base) var(--ease-out);
  }
  .market-search:focus, .market-add-form input:focus, .market-add-form select:focus,
  .market-add-form textarea:focus, .market-pantry-add input:focus { border-color: var(--accent); }
  .market-results { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .market-result {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: var(--r-sm); font-size: 12px; cursor: pointer;
    transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  .market-result:hover { background: var(--soft); border-color: var(--line2); }
  .market-result .m-name { font-weight: 600; color: var(--t1); }
  .market-result .m-type { color: var(--t3); }
  .market-result .m-fav {
    margin-left: auto; cursor: pointer; font-size: 15px; color: var(--t3);
    transition: color var(--dur-fast) var(--ease-out);
  }
  .market-result .m-fav:hover { color: var(--accent); }
  .market-result .m-fav.on { color: var(--accent); }
  .market-add-toggle {
    margin-top: 10px; width: 100%; padding: 7px; font-size: 13px; color: var(--accent);
    background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: var(--r-sm); cursor: pointer;
    transition: background-color var(--dur-base) var(--ease-out);
  }
  .market-add-toggle:hover { background: var(--accent-soft); }
  .market-add-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .market-add-form textarea { resize: vertical; font-family: inherit; }
  .market-submit {
    padding: 7px 12px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--r-sm); font-size: 13px; cursor: pointer;
  }
  .market-label { font-size: 12px; color: var(--t2); margin: 12px 0 6px; font-weight: 500; }
  .market-pantry-add { display: flex; gap: 6px; margin-top: 6px; }
  .market-pantry-add input { flex: 1; }
  .market-pantry-add button {
    padding: 7px 12px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--r-sm); font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .market-fav { font-size: 12px; color: var(--t3); line-height: 1.7; }
  .market-fav .fav-item { display: flex; align-items: center; gap: 6px; }
  .market-fav .fav-item .f-name { cursor: pointer; color: var(--t1); }
  .market-fav .fav-item .f-name:hover { color: var(--accent); }
  .market-fav .fav-item .f-del { color: var(--t3); cursor: pointer; padding: 0 2px; }
  .market-fav .fav-item .f-del:hover { color: var(--accent); }

  /* 喜好 / 菜市场面板 */
  .entry-head-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .head-btn {
    padding: 7px 14px; font-size: 13px; font-weight: 500;
    color: var(--t1); background: var(--card);
    border: 1px solid var(--line2); border-radius: var(--r-sm);
    cursor: pointer;
    transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
  }
  .head-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .head-btn .arrow { display: inline-block; font-size: 10px; margin-left: 2px; transition: transform var(--dur-slow) var(--ease-out); }
  .head-btn.open .arrow { transform: rotate(180deg); }
  .panel { padding-top: 4px; }
  .prefs-section { margin-bottom: 24px; }
  .prefs-section:last-child { margin-bottom: 0; }
  .prefs-title { font-size: 14px; font-weight: 600; color: var(--t1); margin-bottom: 10px; }
  .prefs-add { display: flex; gap: 6px; margin-top: 8px; }
  .prefs-add input {
    flex: 1; padding: 7px 10px; font-size: 13px; color: var(--t1);
    border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--card); outline: none;
    transition: border-color var(--dur-base) var(--ease-out);
  }
  .prefs-add input:focus { border-color: var(--accent); }
  .prefs-add button {
    padding: 7px 14px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--r-sm); font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .prefs-add button:hover { background: var(--accent-hover); }

  .price-add { display: flex; gap: 6px; margin-bottom: 12px; }
  .price-add input, .price-add select {
    padding: 7px 10px; font-size: 13px; color: var(--t1);
    border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--card); outline: none;
    transition: border-color var(--dur-base) var(--ease-out);
  }
  .price-add input#priceName { flex: 1; }
  .price-add input#priceValue { width: 90px; }
  .price-add select { width: 88px; }
  .price-add input:focus, .price-add select:focus { border-color: var(--accent); }
  .price-add button {
    padding: 7px 14px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--r-sm); font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .price-add button:hover { background: var(--accent-hover); }
  .price-list { display: flex; flex-direction: column; gap: 6px; }
  .price-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: var(--r-sm); font-size: 13px;
  }
  .price-item .p-name { font-weight: 600; color: var(--t1); flex: 1; }
  .price-item .p-price { color: var(--accent); font-weight: 600; }
  .price-item .p-unit { color: var(--t3); font-size: 12px; }
  .price-item .p-edit, .price-item .p-del { color: var(--t3); cursor: pointer; padding: 2px 4px; font-size: 12px; }
  .price-item .p-edit:hover, .price-item .p-del:hover { color: var(--accent); }

  .add-form { display: flex; flex-direction: column; gap: 10px; }
  .add-form input, .add-form select, .add-form textarea {
    width: 100%; padding: 8px 12px; font-size: 13px; color: var(--t1);
    border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--card); outline: none;
    transition: border-color var(--dur-base) var(--ease-out);
  }
  .add-form input:focus, .add-form select:focus, .add-form textarea:focus { border-color: var(--accent); }
  .add-form textarea { resize: vertical; font-family: inherit; }
  .add-row { display: flex; gap: 8px; }
  .add-row select, .add-row input { flex: 1; }

  /* Toast */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--t1); color: #fff; padding: 9px 18px; border-radius: 22px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out); z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* ========== 按压反馈 ========== */
  button:active, .chip:active, .scene-pill:active, .day-chip:active {
    transform: scale(0.97);
  }

  /* ========== 减弱动效：去掉位移/缩放，保留颜色与透明度反馈 ========== */
  @media (prefers-reduced-motion: reduce) {
    .dish-card.anim { animation: none; }
    .modal-card, .modal:not(.hidden) .modal-card { transform: none; transition: none; }
    #toast, #toast.show { transform: translateX(-50%); }
    .advanced-toggle .arrow, .disclosure .arrow { transition: none; }
    button:active, .chip:active, .scene-pill:active, .day-chip:active { transform: none; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <h1>今天吃什么</h1>
    <p>从"不知道吃什么"到"菜端上桌"，约束内随机，帮你一次搞定</p>
  </header>

  <!-- 入口面板 -->
  <section class="entry-panel">
    <div class="entry-head">
      <h2>今天想吃什么？</h2>
      <div class="entry-head-btns">
        <button class="head-btn" id="searchToggle">🔍 搜菜</button>
        <button class="head-btn" id="addRecipeToggle">＋ 加菜</button>
        <button class="head-btn" id="advToggle">高级配置 <span class="arrow">▾</span></button>
      </div>
    </div>

    <div class="entry-body">
      <div class="scene-pills" id="scenePills"></div>
      <div class="entry-controls">
        <div class="counter" id="peopleCounter">
          <span class="counter-label">人数</span>
          <div class="counter-ctrl">
            <button data-step="-1">−</button>
            <input type="text" value="3" readonly>
            <button data-step="1">+</button>
          </div>
        </div>
        <div class="counter" id="dishCounter">
          <span class="counter-label">菜</span>
          <div class="counter-ctrl">
            <button data-step="-1">−</button>
            <input type="text" value="2" readonly>
            <button data-step="1">+</button>
          </div>
        </div>
        <div class="counter" id="soupCounter">
          <span class="counter-label">汤</span>
          <div class="counter-ctrl">
            <button data-step="-1">−</button>
            <input type="text" value="1" readonly>
            <button data-step="1">+</button>
          </div>
        </div>
        <div class="counter" id="dayCounter" style="display:none">
          <span class="counter-label">天数</span>
          <div class="counter-ctrl">
            <button data-step="-1">−</button>
            <input type="text" value="7" readonly>
            <button data-step="1">+</button>
          </div>
        </div>
        <button class="btn-generate" id="btnGenerate">生成方案</button>
      </div>
    </div>

    <!-- 关键约束常驻可见：忌口 / 过敏 / 预算 / 现成食材 -->
    <div class="quick-constraints">
      <div class="adv-group">
        <label class="adv-label">忌口（硬约束，绝不会出现）</label>
        <div class="chips" id="tabooChips"></div>
      </div>
      <div class="adv-group">
        <label class="adv-label">过敏（硬约束）</label>
        <div class="chips" id="allergyChips"></div>
      </div>
      <div class="adv-row">
        <div class="field" style="max-width:180px">
          <label>预算（元 / 整桌）</label>
          <input type="number" id="budget" placeholder="不限" min="0">
        </div>
        <div class="field" style="min-width:240px">
          <label>家里现有食材（优先消耗，逗号分隔）</label>
          <input type="text" id="pantry" placeholder="如：鸡蛋, 西红柿">
        </div>
      </div>
    </div>

    <div class="scene-hint" id="sceneHint"></div>

    <div class="advanced-panel" id="advPanel">
      <div class="adv-group">
        <label class="adv-label">口味偏好（软约束，只影响推荐概率）</label>
        <div class="chips" id="tasteChips"></div>
      </div>
      <div class="adv-group">
        <label class="adv-label">厨房设备（没勾的设备不会被用到的菜）</label>
        <div class="chips" id="deviceChips"></div>
      </div>
      <div class="adv-group">
        <label class="adv-label">其他约束</label>
        <div class="adv-row">
          <div class="field">
            <label>时间（分钟）</label>
            <select id="timeBudget">
              <option value="">不限</option>
              <option value="20">20 分钟内</option>
              <option value="30">30 分钟内</option>
              <option value="60">60 分钟内</option>
              <option value="90">90 分钟内</option>
            </select>
          </div>
          <div class="field">
            <label>难度上限</label>
            <select id="maxDifficulty">
              <option value="">不限</option>
              <option value="1">★ 极简</option>
              <option value="2">★★ 简单</option>
              <option value="3">★★★ 中等</option>
              <option value="4">★★★★ 挑战</option>
              <option value="5">★★★★★ 硬核</option>
            </select>
          </div>
          <div class="field">
            <label>营养目标</label>
            <select id="nutritionGoal">
              <option value="">无</option>
              <option>均衡</option>
              <option>减脂</option>
              <option>增肌</option>
              <option>控糖</option>
            </select>
          </div>
        </div>
      </div>
      <div class="adv-group">
        <label class="adv-label">多 Agent 编排（LangGraph）</label>
        <label class="check-row">
          <input type="checkbox" id="useGraph">
          <span>用「规划师 → 营养师 → 采购员 → 搭配师」四 Agent 工作流生成（营养不达标会自动重选，最多 3 轮）</span>
        </label>
        <p class="llm-hint" id="graphNote"></p>
      </div>
      <div class="adv-group">
        <label class="adv-label">LLM 设置（可选，接入后搭配说明更智能；不配也能完整使用）</label>
        <div class="adv-row">
          <div class="field" style="min-width:200px">
            <label>Base URL</label>
            <input type="text" id="llmBaseUrl" placeholder="如 https://api.deepseek.com/v1">
          </div>
          <div class="field" style="min-width:200px">
            <label>API Key</label>
            <input type="text" id="llmApiKey" placeholder="sk-...">
          </div>
          <div class="field" style="min-width:140px">
            <label>模型</label>
            <input type="text" id="llmModel" placeholder="如 deepseek-chat">
          </div>
        </div>
        <div class="llm-actions">
          <button class="head-btn" id="llmSave">保存</button>
          <button class="head-btn" id="llmTest">测试连接</button>
          <span id="llmStatus" class="llm-status"></span>
        </div>
        <p class="llm-hint" id="llmHint"></p>
      </div>
    </div>
  </section>

  <!-- 主体双栏 -->
  <div class="main-grid">
    <main class="main-panel">
      <div class="view-tabs">
        <button class="view-tab active" data-view="meal">今日一餐</button>
        <button class="view-tab" data-view="weekly">一周菜单</button>
        <button class="view-tab" data-view="prefs">喜好</button>
        <button class="view-tab" data-view="market">菜市场</button>
      </div>

      <div id="resultArea">
        <div class="empty-state">
          <div class="big">🍳</div>
          选好场景，点「生成方案」<br>给你一桌惊喜但不离谱的搭配
        </div>
      </div>

      <!-- 喜好 -->
      <div id="prefsPanel" class="panel" hidden>
        <div class="prefs-section">
          <div class="prefs-title">我的口味</div>
          <div class="chips" id="prefTasteChips"></div>
        </div>
        <div class="prefs-section">
          <div class="prefs-title">口味画像（来自 👍/👎 反馈）</div>
          <div id="profileBox"></div>
        </div>
        <div class="prefs-section">
          <div class="prefs-title">讨厌的食材（含这些的菜不出现）</div>
          <div class="chips" id="dislikeChips"></div>
          <div class="prefs-add">
            <input type="text" id="dislikeInput" placeholder="加食材，如：香菜">
            <button id="dislikeAdd">加</button>
          </div>
        </div>
        <div class="prefs-section">
          <div class="prefs-title">常备食材（生成时优先消耗）</div>
          <div class="chips" id="pantryChips"></div>
          <div class="prefs-add">
            <input type="text" id="pantryInput" placeholder="加食材，如：土豆">
            <button id="pantryAdd">加</button>
          </div>
        </div>
        <div class="prefs-section">
          <div class="prefs-title">收藏的菜品</div>
          <div id="favList" class="market-fav"></div>
        </div>
      </div>

      <!-- 菜市场（食材价格） -->
      <div id="marketPanel" class="panel" hidden>
        <div class="prefs-title">食材价格（用于估算成本）</div>
        <div class="price-add">
          <input type="text" id="priceName" placeholder="食材，如：猪肉">
          <input type="number" id="priceValue" placeholder="价格" step="0.1" min="0">
          <select id="priceUnit">
            <option>元/斤</option><option>元/个</option><option>元/把</option><option>元/盒</option><option>元/瓶</option>
          </select>
          <button id="priceAdd">加</button>
        </div>
        <div id="priceList" class="price-list"></div>
      </div>
    </main>
  </div>
</div>

<div id="toast"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><span id="modalTitle">家常简化版做法</span><button id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="searchModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><span>搜菜</span><button id="searchModalClose">✕</button></div>
    <div class="modal-body">
      <input type="text" id="searchInput" class="market-search" placeholder="搜菜名/食材，如：牛肉、红烧肉">
      <div id="searchResults" class="market-results"></div>
    </div>
  </div>
</div>

<div id="addRecipeModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><span>添加一道菜</span><button id="addRecipeModalClose">✕</button></div>
    <div class="modal-body add-form">
      <input type="text" id="addName" placeholder="菜名，如：西红柿炒鸡蛋">
      <select id="addType"><option>荤</option><option>素</option><option>汤</option><option>主食</option></select>
      <input type="text" id="addIngredients" placeholder="食材（逗号分隔）：西红柿,鸡蛋,葱">
      <textarea id="addSteps" rows="4" placeholder="做法，每行一步"></textarea>
      <div class="add-row">
        <select id="addDifficulty">
          <option value="">难度（可选）</option>
          <option value="1">★ 极简</option>
          <option value="2">★★ 简单</option>
          <option value="3">★★★ 中等</option>
          <option value="4">★★★★ 挑战</option>
          <option value="5">★★★★★ 硬核</option>
        </select>
        <input type="number" id="addMinutes" placeholder="耗时（分钟，可选）" min="1">
      </div>
      <button id="addSubmit" class="market-submit">保存到我的菜谱</button>
    </div>
  </div>
</div>

<script>
let META = null;
let view = 'meal';          // meal | weekly | prefs | market
let currentScene = null;
let currentPeople = 3;
let currentSeed = null;
let currentData = null;     // 最近一次生成的数据（大小份/锁定后重渲染用）
let currentMenu = [];       // 当前菜单（点击看做法用）
let currentRecipe = null;   // 做法弹窗里当前这道菜
let PROFILE = null;         // 家庭味觉画像摘要
let mealHTML = null;        // 今日一餐方案（切换 tab 不丢）
let weeklyHTML = null;      // 一周菜单方案（切换 tab 不丢）
let lockedIds = [];         // 已保存/锁定的菜 id（localStorage 持久化）
let favorites = [];         // 收藏的菜 {id, name}（localStorage）
let pantryItems = [];       // 常备食材（后端持久化）
let tastePrefs = [];        // 我的口味（localStorage）
let dislikes = [];          // 讨厌的食材（localStorage）
try { lockedIds = JSON.parse(localStorage.getItem('lockedIds') || '[]'); } catch (e) { lockedIds = []; }
try { favorites = JSON.parse(localStorage.getItem('favorites') || '[]'); } catch (e) { favorites = []; }
try { tastePrefs = JSON.parse(localStorage.getItem('tastePrefs') || '[]'); } catch (e) { tastePrefs = []; }
try { dislikes = JSON.parse(localStorage.getItem('dislikes') || '[]'); } catch (e) { dislikes = []; }

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 元数据加载 ---------- */
async function loadMeta() {
  META = await (await fetch('/api/meta')).json();
  renderScenePills(META.scenes || []);
  renderChips($('tabooChips'), META.taboos);
  renderChips($('allergyChips'), META.allergies);
  renderChips($('deviceChips'), META.devices);
  renderTastePrefs();
  renderDislikes();
  // 打包版（EXE）裁剪了 LangGraph，这里禁用开关而不是让用户点了收到 500
  if (META.graph_available === false) {
    const cb = $('useGraph');
    cb.disabled = true;
    cb.checked = false;
    const note = document.getElementById('graphNote');
    if (note) note.textContent = '当前运行环境（打包版）未内置 LangGraph，多 Agent 编排不可用；规则流水线推荐完全不受影响。';
  }
}

function renderScenePills(scenes) {
  const el = $('scenePills');
  el.innerHTML = '';
  scenes.forEach(s => {
    const b = document.createElement('button');
    b.className = 'scene-pill';
    b.textContent = `${s.icon || ''} ${s.name}`;
    b.onclick = () => applyScene(s, b);
    el.appendChild(b);
  });
}

function renderChips(el, items) {
  el.innerHTML = '';
  (items || []).forEach(it => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = it;
    c.onclick = () => c.classList.toggle('selected');
    el.appendChild(c);
  });
}

function getSelected(el) { return [...el.querySelectorAll('.chip.selected')].map(c => c.textContent); }

/* ---------- 场景 ---------- */
function applyScene(s, el) {
  if (currentScene === s.id) {
    currentScene = null;
    document.querySelectorAll('.scene-pill').forEach(x => x.classList.remove('active'));
    $('sceneHint').innerHTML = '';
    toast('已取消场景预设');
    return;
  }
  currentScene = s.id;
  document.querySelectorAll('.scene-pill').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  const d = s.defaults || {};
  if (d.dishes !== undefined) setCounter('dishCounter', d.dishes, 0, 10);
  if (d.soups !== undefined) setCounter('soupCounter', d.soups, 0, 5);
  if (d.time_budget !== undefined) $('timeBudget').value = d.time_budget ?? '';
  if (d.max_difficulty !== undefined) $('maxDifficulty').value = d.max_difficulty ?? '';
  if (d.nutrition_goal !== undefined) $('nutritionGoal').value = d.nutrition_goal ?? '';
  $('sceneHint').innerHTML = `已应用 <b>${esc(s.name)}</b>：${esc(s.desc || '')}`;
}

/* ---------- 计数器 ---------- */
function bindCounter(id, min, max) {
  const ctrl = $(id).querySelector('.counter-ctrl');
  const input = ctrl.querySelector('input');
  ctrl.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      let v = parseInt(input.value) + parseInt(btn.dataset.step);
      v = Math.max(min, Math.min(max, v));
      input.value = v;
      if (id === 'peopleCounter') currentPeople = v;
    };
  });
}
function setCounter(id, v, min, max) {
  const input = $(id).querySelector('input');
  input.value = Math.max(min, Math.min(max, v));
  if (id === 'peopleCounter') currentPeople = input.value | 0;
}

/* ---------- 高级配置展开 ---------- */
$('advToggle').onclick = () => {
  $('advToggle').classList.toggle('open');
  $('advPanel').classList.toggle('open');
};

/* ---------- Tab 切换 ---------- */
function switchView(v) {
  view = v;
  document.querySelectorAll('.view-tab').forEach(x => x.classList.toggle('active', x.dataset.view === v));
  const isMeal = v === 'meal', isWeekly = v === 'weekly';
  $('resultArea').style.display = (isMeal || isWeekly) ? '' : 'none';
  $('prefsPanel').hidden = v !== 'prefs';
  $('marketPanel').hidden = v !== 'market';
  $('dishCounter').style.display = isMeal ? '' : 'none';
  $('soupCounter').style.display = isMeal ? '' : 'none';
  $('dayCounter').style.display = isWeekly ? '' : 'none';
  if (v === 'prefs') { renderTastePrefs(); renderDislikes(); renderPantry(); renderFavorites(); loadProfile(); }
  if (v === 'market') { renderPrices(); }
  if (isMeal) $('resultArea').innerHTML = mealHTML || emptyHTML('选好场景，点「生成方案」');
  if (isWeekly) $('resultArea').innerHTML = weeklyHTML || emptyHTML('一周不重样，顺便把整周采购清单算好');
}
document.querySelectorAll('.view-tab').forEach(t => { t.onclick = () => switchView(t.dataset.view); });

function emptyHTML(hint) {
  return `<div class="empty-state"><div class="big">🍳</div>${esc(hint)}</div>`;
}

/* ---------- 组装请求 ---------- */
function buildReq() {
  return {
    people: currentPeople,
    dishes: +($('dishCounter').querySelector('input').value) || 0,
    soups: +($('soupCounter').querySelector('input').value) || 0,
    taboos: getSelected($('tabooChips')),
    allergies: getSelected($('allergyChips')),
    taste_prefs: tastePrefs,
    devices: getSelected($('deviceChips')),
    budget: $('budget').value ? +$('budget').value : null,
    time_budget: $('timeBudget').value ? +$('timeBudget').value : null,
    max_difficulty: $('maxDifficulty').value ? +$('maxDifficulty').value : null,
    nutrition_goal: $('nutritionGoal').value || null,
    pantry: [...pantryItems, ...$('pantry').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean)],
    scene_id: currentScene,
    homely: true,
    locked_ids: lockedIds,
    dislikes: dislikes,
    favorite_ids: favorites.map(f => f.id),
  };
}

/* ---------- 生成 ---------- */
async function postJSON(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  let data = null;
  try { data = await r.json(); } catch (e) { data = null; }
  if (!r.ok) {
    // 服务端错误（422 参数校验 / 500）以前会被静默当成"生成成功但 0 道菜"
    const detail = data && (data.detail || data.error);
    throw new Error(typeof detail === 'string' ? detail : `请求失败（HTTP ${r.status}）`);
  }
  return data || {};
}

async function generate() {
  if (view !== 'meal' && view !== 'weekly') switchView('meal');
  const dishN = +($('dishCounter').querySelector('input').value) || 0;
  const soupN = +($('soupCounter').querySelector('input').value) || 0;
  if (view === 'meal' && dishN + soupN <= 0 && !lockedIds.length) {
    toast('至少选 1 道菜或 1 道汤');
    return;
  }
  if (view === 'meal' && lockedIds.length > dishN + soupN) {
    toast(`锁定了 ${lockedIds.length} 道，但只设了 ${dishN + soupN} 个菜位，多余的会被忽略`);
  }
  const btn = $('btnGenerate');
  btn.disabled = true;
  btn.textContent = '生成中…';
  currentSeed = Math.floor(Math.random() * 1e9);

  const useGraph = $('useGraph').checked;
  let url, body;
  if (view === 'weekly') {
    url = '/api/weekly';
    body = Object.assign({}, buildReq(), { days: +($('dayCounter').querySelector('input').value) || 7, seed: currentSeed });
  } else {
    url = useGraph ? '/api/plan/graph' : '/api/recommend';
    body = Object.assign({}, buildReq(), { seed: currentSeed });
  }

  try {
    const data = await postJSON(url, body);
    if (data.ok === false) {
      $('resultArea').innerHTML = emptyHTML(data.error || '没有符合条件的菜，试试放宽约束');
      return;
    }
    if (view === 'weekly') renderWeekly(data); else renderMeal(data);
    $('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    $('resultArea').innerHTML = emptyHTML('生成失败：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '生成方案';
  }
}

$('btnGenerate').onclick = () => generate();

/* ---------- 菜品卡 ---------- */

function dishCard(r, i, animate = true) {

  const fav = favorites.some(f => f.id === r.id);

  const visual = (cur.visuals || {})[r.id] || (r.dish_type === '汤' ? '🍲' : '🍽️');
  const cost = (cur.costs || {})[r.id];
  const reasons = (cur.reasons || {})[r.id] || [];
  return `
    <div class="dish-card${animate ? ' anim' : ''}" style="animation-delay:${(i || 0) * 60}ms" data-id="${esc(r.id)}">
      <div class="dish-visual" aria-hidden="true">${visual}</div>
      <div class="dish-name">${esc(r.name)}</div>
      <div class="dish-info">
        <div class="dish-tags">
          ${r.dish_type ? `<span class="tag type">${esc(r.dish_type)}</span>` : ''}
          ${r.spiciness ? `<span class="tag">${esc(r.spiciness)}</span>` : ''}
        </div>
        <div class="dish-meta">
          <span class="star">${'★'.repeat(r.difficulty || 0) || '—'}</span>
          ${r.estimated_minutes ? '约 ' + r.estimated_minutes + ' 分钟' : '耗时未知'}
          ${r.calories_kcal ? '· 约 ' + r.calories_kcal + ' 千卡' : ''}
          ${cost != null ? '· 约 ' + cost + ' 元' : ''}
          ${taste ? '<br>口味 ' + esc(taste) : ''}${r.season ? '，时令 ' + esc(r.season) : ''}
        </div>
        ${reasons.length ? `<div class="dish-why">${reasons.map(x => `<span class="why-chip">${esc(x)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="dish-actions">
        <button class="action-btn" data-act="how" data-id="${esc(r.id)}">看做法</button>
        <button class="action-btn fav${fav ? ' done' : ''}" data-act="fav" data-id="${esc(r.id)}">${fav ? '⭐ 已收藏' : '⭐ 收藏'}</button>
        <button class="action-btn lock${locked ? ' done' : ''}" data-act="lock" data-id="${esc(r.id)}">${locked ? '🔒 已锁定' : '🔒 锁定'}</button>
      </div>
      <div class="dish-feedback">
        <span class="fb-label">这菜合你口味吗</span>
        <button class="fb-btn" data-act="fb-up" data-id="${esc(r.id)}" title="喜欢，以后多推荐">👍</button>
        <button class="fb-btn" data-act="fb-down" data-id="${esc(r.id)}" title="不喜欢，以后少推荐">👎</button>
      </div>
    </div>`;
}

function recipeToolsHTML() {
  return `<div class="modal-tools">
      <button class="head-btn" data-tool="leftover">♻️ 一菜两吃（剩了怎么再吃一顿）</button>
      <button class="head-btn" data-tool="simplify">🍳 家常简化版做法</button>
    </div>`;
}

/* 弹窗内容统一由这个函数渲染：original（原做法）+ extra（附加结果） */
function renderRecipeModal(recipe, extra = '') {
  openModal(recipe.name, recipeToolsHTML() + renderSteps([recipe]) + extra);
}

async function openRecipe(id) {
  let r = currentMenu.find(x => x.id === id);
  if (!r) {
    try { r = await (await fetch('/api/recipes/' + encodeURIComponent(id))).json(); }
    catch (e) { toast('读不到这道菜'); return; }
  }
  if (!r || !r.name) return;
  currentRecipe = r;
  renderRecipeModal(r);
}

/* 做法弹窗里的两个附加功能 */
function setModalExtra(html, spinner) {
  if (!currentRecipe) return;
  renderRecipeModal(currentRecipe, spinner ? `<div class="loading">${esc(spinner)}</div>` : html);
}

async function modalLeftover(name) {
  setModalExtra('', '正在找二次加工方案…');
  try {
    const d = await postJSON('/api/leftover', { recipe_name: name, n: 3 });
    if (d.source == null) {
      setModalExtra('');
      toast(d.error || '没找到这道菜');
      return;
    }
    const items = (d.suggestions || []).map(s =>
      `<div class="reuse-item"><div class="reuse-name">${esc(s.recipe.name)}</div><div class="reuse-how">${esc(s.how)}</div></div>`
    ).join('') || '<div class="nutri-note">没找到合适的二次加工方案</div>';
    setModalExtra(`<div class="zone" style="margin-top:14px"><h4>二次加工方案</h4>${items}</div>`);
  } catch (e) {
    setModalExtra('');
    toast('查询失败：' + e.message);
  }
}

async function modalSimplify(name) {
  setModalExtra('', '正在生成家常简化版…（需要已配置 LLM，最长 30 秒）');
  try {
    const d = await postJSON('/api/simplify', { recipe_name: name });
    if (!d.ok) {
      setModalExtra(`<div class="nutri-note">生成不了简化版：${esc(d.error || '未知原因')}<br>（不配 LLM 不影响其它功能，推荐本身不依赖 LLM）</div>`);
      return;
    }
    setModalExtra(`<div class="zone" style="margin-top:14px"><h4>🤖 家常简化版</h4><pre class="simplified">${esc(d.simplified)}</pre></div>`);
  } catch (e) {
    setModalExtra(`<div class="nutri-note">生成失败：${esc(e.message)}</div>`);

function toggleLock(id) {
  const i = lockedIds.indexOf(id);
  if (i >= 0) { lockedIds.splice(i, 1); toast('已取消保存'); }
  else { lockedIds.push(id); toast('已保存，下次随机还会保留这道菜'); }
  try { localStorage.setItem('lockedIds', JSON.stringify(lockedIds)); } catch (e) {}
  if (currentData) renderMeal(currentData, false);
}

/* ---------- 渲染：今日一餐 ---------- */
function renderMeal(d, animate = true) {
  currentData = d;
  currentMenu = d.menu || [];
  const info = d.info || {};
  let html = '';

  let meta = `共 ${currentMenu.length} 道，估算 ${d.shopping ? d.shopping.est_cost_yuan : 0} 元`;
  if (info.balanced === false) meta += '，本桌没配到素菜（候选池限制）';
  if (info.fallback) {
    meta += `，<b class="warn">${esc(info.fallback_reason || '约束太紧，已给最接近的方案')}</b>`;
  }
  meta += `<br>搭配说明来源：${d.llm_used ? '🤖 LLM 生成' : '📝 模板（未使用 LLM）'}`;

  const trace = renderTrace(d);
  html += `<div class="plan-summary">${esc(d.pairing_note || '')}<div class="summary-meta">${meta}</div>${trace}</div>`;

  html += `<div class="dish-grid">${currentMenu.map((r, i) => dishCard(r, i, animate)).join('')}</div>`;

  html += disclosure('detail', `采购清单 & 营养 & 分步做法（按 ${currentPeople} 人份量）`,
    (d.shopping ? renderShopping(d.shopping) : '') + renderNutrition(d.nutrition) + renderSteps(d.menu));

  mealHTML = html;
  if (view === 'meal') $('resultArea').innerHTML = html;
}

/* 多 Agent 编排过程（只在用了 /api/plan/graph 时才有） */
function renderTrace(d) {
  const trace = d.agent_trace || [];
  if (!trace.length) return '';
  const lines = trace.map(t => `<div class="trace-line"><b>${esc(t.agent)}</b>：${esc(t.note)}</div>`).join('');
  const replan = d.replans ? `，营养师回退重规划 ${d.replans} 轮` : '，一次达标';
  return disclosure('trace', `多 Agent 编排过程（${trace.length} 步${replan}）`, lines);
}

/* ---------- 渲染：一周菜单 ---------- */
function renderWeekly(d) {
  currentData = null;
  currentMenu = (d.days || []).flatMap(day => day.menu || []).filter((r, i, arr) => arr.findIndex(x => x.id === r.id) === i);
  const s = d.summary || {};
  let html = `<div class="week-summary">
    共 <b>${s.days}</b> 天，<b>${s.total_dishes}</b> 道菜（<b>${s.unique_dishes}</b> 道不重样），
    荤 <b>${s.meat}</b> / 素 <b>${s.veg}</b> / 汤 <b>${s.soup}</b>，
    整周估算 <b>${d.week_shopping ? d.week_shopping.est_cost_yuan : 0}</b> 元
    ${s.balanced_days >= 0 ? `<br>荤素均衡 <b>${s.balanced_days}</b>/${s.days_with_menu} 天（有荤有素）` : ''}
    ${s.repeated_days && s.repeated_days.length ? `<br><b class="warn">第 ${s.repeated_days.join('、')} 天候选菜不足，放宽了"不重样"</b>` : ''}
  </div>`;

  html += (d.days || []).map(day => {
    const info = day.info || {};
    const tag = day.menu && day.menu.length && info.balanced === false
      ? '<span class="day-tag warn">无素菜</span>' : '';
    return `
    <div class="day-row">
      <h4>第 ${day.day} 天${tag}</h4>
      <div class="day-chips">
        ${day.menu && day.menu.length
          ? day.menu.map(r => `<button class="day-chip" data-id="${esc(r.id)}">${esc(r.name)}</button>`).join('')
          : `<span class="tips">${esc(day.error || '无结果')}</span>`}
      </div>
    </div>`;
  }).join('');

  html += disclosure('weekDetail', '整周采购清单', d.week_shopping ? renderShopping(d.week_shopping) : '');

  weeklyHTML = html;
  if (view === 'weekly') $('resultArea').innerHTML = html;
}

function disclosure(id, title, body) {
  return `<button class="disclosure" data-toggle="${id}"><span class="arrow">▶</span><span>${esc(title)}</span></button>
          <div class="disclose-body" id="${id}">${body}</div>`;
}

function renderShopping(shopping) {
  return shopping.zones.map(z => {
    const isCond = z.zone === '小料' || z.zone === '调料';
    const hint = isCond ? '（做菜用量）' : '';
    return `<div class="zone"><h4>${esc(z.zone)}${hint}</h4><ul>
      ${z.items.map(it => `<li>${esc(it.name)}${it.optional ? ' <span class="amt">(可选)</span>' : ''} <span class="amt">${it.amount ? '，' + esc(it.amount) : ''}${!isCond && it.used_by.length > 1 ? '，共 ' + it.used_by.length + ' 道菜用' : ''}</span></li>`).join('')}
    </ul></div>`;
  }).join('');
}

function renderNutrition(n) {
  if (!n) return '';
  const num = v => (v == null ? '—' : v);
  const ppm = n.per_person_macros || {};
  const macros = `
      <span><span class="k">热量</span> <span class="v">${n.per_person_kcal} 千卡/人</span> <span class="k">（整桌 ${n.total_kcal}）</span></span>
      <span><span class="k">蛋白质</span> <span class="v">${num(ppm.protein_g)} g</span></span>
      <span><span class="k">脂肪</span> <span class="v">${num(ppm.fat_g)} g</span></span>
      <span><span class="k">碳水</span> <span class="v">${num(ppm.carb_g)} g</span></span>
      <span><span class="k">纤维</span> <span class="v">${num(ppm.fiber_g)} g</span></span>`;
  const shares = n.protein_pct != null
    ? `<div class="nutri-strip"><span><span class="k">供能比（蛋白/脂肪/碳水）</span> <span class="v">${n.protein_pct}% / ${n.fat_pct}% / ${n.carb_pct}%</span></span></div>`
    : '';
  const ratio = n.meat_veg_ratio == null
    ? '本餐没有素菜'
    : `荤:素 = ${n.meat_veg_ratio}:1（按热量）`;

  return `<div class="zone"><h4>营养估算</h4>
    <div class="nutri-strip">
      <span><span class="k">荤/素/汤</span> <span class="v">${n.meat_count}/${n.veg_count}/${n.soup_count}</span></span>
      <span><span class="k">荤素搭配</span> <span class="v">${esc(ratio)}</span></span>
    </div>
    <div class="nutri-strip nutri-macros">${macros}</div>
    ${shares}
    ${n.macro_note ? `<div class="nutri-note">${esc(n.macro_note)}</div>` : ''}
    ${(n.tips || []).map(t => `<div class="tips">${esc(t)}</div>`).join('')}
    <div class="disclaimer">${esc(n.disclaimer || '')}</div>
  </div>`;
}

function resolvePortion(text) {
  const p = currentPeople || 1;
  const fmt = v => (Math.round(v) === v ? String(Math.round(v)) : String(Math.round(v * 10) / 10));
  return String(text || '')
    .replace(/份数\s*\*\s*(\d+(?:\.\d+)?)/g, (_, n) => fmt(parseFloat(n) * p))
    .replace(/(\d+(?:\.\d+)?)\s*(g|ml|毫升|克|升)\s*\*\s*份数/gi, (_, n, u) => fmt(parseFloat(n) * p) + u)
    .replace(/(\d+(?:\.\d+)?)\s*\*\s*份数/g, (_, n) => fmt(parseFloat(n) * p))
    .replace(/份数/g, String(p));
}

function renderSteps(menu) {
  if (!menu || !menu.length) return '';
  return `<div class="zone"><h4>分步做法</h4>` + menu.map(r => `
    <div class="step-dish">
      <h4>${esc(r.name)}</h4>
      ${(r.steps || []).map(g => (g.group ? `<h4 style="font-size:12px;color:var(--t2);margin-top:6px">${esc(g.group)}</h4>` : '') +
        `<ol>${(g.steps || []).map(s => `<li>${esc(resolvePortion(s.text))}</li>`).join('')}</ol>`).join('')}
      ${(r.tips || []).length ? `<div class="tips">${r.tips.map(esc).join('；')}</div>` : ''}
    </div>`).join('') + `</div>`;
}

/* ---------- 事件委托：折叠 / 反馈 / 锁定 / 看做法 ---------- */
$('resultArea').addEventListener('click', e => {
  const dis = e.target.closest('.disclosure');
  if (dis) {
    dis.classList.toggle('open');
    const body = document.getElementById(dis.dataset.toggle);
    if (body) body.classList.toggle('open');
    return;
  }
  const btn = e.target.closest('[data-act]');
  if (btn) {
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    if (act === 'lock') { toggleLock(id); return; }
    if (act === 'fav') { toggleFav(id); return; }
    if (act === 'how') { openRecipe(id); return; }
    if (act === 'fb-up') { sendFeedback(id, 1, btn); return; }
    if (act === 'fb-down') { sendFeedback(id, -1, btn); return; }
  }
  const dayChip = e.target.closest('.day-chip');
  if (dayChip) { openRecipe(dayChip.dataset.id); return; }
  // 点击菜名/信息区（非按钮）→ 查看分步做法
  const info = e.target.closest('.dish-name, .dish-info');
  if (info) { openRecipe(info.closest('.dish-card').dataset.id); return; }
});

/* ---------- 口味反馈：写入本地画像，影响后续软约束打分 ---------- */
const feedback = {};   // recipe id -> 1/-1
try { Object.assign(feedback, JSON.parse(localStorage.getItem('feedback') || '{}')); } catch (e) {}

async function sendFeedback(id, value, btn) {
  const prev = feedback[id];
  if (prev === value) {
    toast('已经记过了');
    return;
  }
  try {
    const d = await postJSON('/api/feedback', { recipe_id: id, feedback: value });
    feedback[id] = value;
    try { localStorage.setItem('feedback', JSON.stringify(feedback)); } catch (e) {}
    // 同步按钮状态
    const card = btn.closest('.dish-card');
    if (card) {
      card.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('done'));
      btn.classList.add('done');
    }
    const count = d.profile ? d.profile.count : 0;
    toast((value > 0 ? '记住了，以后多推荐这类' : '记住了，以后少推荐这道') + `（已记录 ${count} 条口味）`);
    PROFILE = d.profile || PROFILE;
  } catch (e) {
    toast('反馈没记上：' + e.message);
  }
}

/* ---------- 弹窗 ---------- */
function openModal(title, bodyHTML, spin) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHTML;
  $('modalBody').classList.toggle('spin', !!spin);
  $('modal').classList.remove('hidden');
}
$('modalClose').onclick = () => $('modal').classList.add('hidden');
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').classList.add('hidden'); });
$('modalBody').addEventListener('click', e => {
  const t = e.target.closest('[data-tool]');
  if (!t || !currentRecipe) return;
  if (t.dataset.tool === 'leftover') modalLeftover(currentRecipe.name);
  if (t.dataset.tool === 'simplify') modalSimplify(currentRecipe.name);
});
// Esc 关闭所有弹窗
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    ['modal', 'searchModal', 'addRecipeModal'].forEach(id => {
      const m = $(id);
      if (m && !m.classList.contains('hidden')) m.classList.add('hidden');
    });

});

/* ---------- 喜好：口味 / 讨厌 / 常备 / 收藏 ---------- */
function renderTastePrefs() {
  const tastes = META && META.tastes ? META.tastes : ['清淡', '川辣', '酸甜', '咸鲜', '重口'];
  const render = el => {
    el.innerHTML = tastes.map(t => `<button class="chip${tastePrefs.includes(t) ? ' selected' : ''}" data-taste="${esc(t)}">${esc(t)}</button>`).join('');
  };
  render($('tasteChips'));
  render($('prefTasteChips'));
}
function toggleTaste(t) {
  const i = tastePrefs.indexOf(t);
  if (i >= 0) tastePrefs.splice(i, 1); else tastePrefs.push(t);
  try { localStorage.setItem('tastePrefs', JSON.stringify(tastePrefs)); } catch (e) {}
  renderTastePrefs();
}

function renderDislikes() {
  $('dislikeChips').innerHTML = dislikes.map(x =>
    `<span class="pf-chip avoid">${esc(x)} <span class="pf-del" data-x="${esc(x)}">×</span></span>`).join('') || '<span class="pf-chip">暂无</span>';
}
function addDislike() {
  const v = $('dislikeInput').value.trim();
  if (!v) return;
  if (!dislikes.includes(v)) dislikes.push(v);
  try { localStorage.setItem('dislikes', JSON.stringify(dislikes)); } catch (e) {}
  $('dislikeInput').value = '';
  renderDislikes();
}

function toggleFav(id, name) {
  const existing = favorites.find(f => f.id === id);
  const r = currentMenu.find(x => x.id === id);
  name = name || (r ? r.name : (existing ? existing.name : id));
  const i = favorites.findIndex(f => f.id === id);
  if (i >= 0) { favorites.splice(i, 1); toast('已取消收藏'); }
  else { favorites.push({ id, name }); toast('已收藏'); }
  try { localStorage.setItem('favorites', JSON.stringify(favorites)); } catch (e) {}
  renderFavorites();
  if (currentData) renderMeal(currentData, false);
}

function renderFavorites() {
  if (!favorites.length) { $('favList').innerHTML = '还没有收藏'; return; }
  $('favList').innerHTML = favorites.map(f =>
    `<div class="fav-item"><span class="f-name" data-id="${esc(f.id)}">${esc(f.name)}</span><span class="f-del" data-id="${esc(f.id)}">×</span></div>`).join('');
}

function renderPantry() {
  $('pantryChips').innerHTML = pantryItems.map(x =>
    `<span class="pf-chip">${esc(x)} <span class="pf-del" data-x="${esc(x)}">×</span></span>`).join('') || '<span class="pf-chip">暂无</span>';
}

async function loadPantry() {
  try {
    const d = await (await fetch('/api/pantry')).json();
    pantryItems = d.items || [];
  } catch (e) { pantryItems = []; }
  renderPantry();
}

async function addPantry() {
  const v = $('pantryInput').value.trim();
  if (!v) return;
  const items = [...pantryItems, v].filter((x, i, a) => a.indexOf(x) === i);
  try {
    const d = await (await fetch('/api/pantry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items }) })).json();
    pantryItems = d.items || items;
  } catch (e) { pantryItems = items; }
  $('pantryInput').value = '';
  renderPantry();
}

/* ---------- 菜市场：食材价格 ---------- */
let priceItems = [];
async function loadPrices() {
  try {
    const d = await (await fetch('/api/prices')).json();
    priceItems = d.items || [];
  } catch (e) { priceItems = []; }
  renderPrices();
}
function renderPrices() {
  if (!priceItems.length) { $('priceList').innerHTML = '<div class="market-fav">还没有价格，加一个吧</div>'; return; }
  $('priceList').innerHTML = priceItems.map(it =>
    `<div class="price-item"><span class="p-name">${esc(it.name)}</span><span class="p-price">${it.price != null ? it.price : '—'}</span><span class="p-unit">${esc(it.unit || '元/斤')}</span><span class="p-edit" data-name="${esc(it.name)}">改</span><span class="p-del" data-name="${esc(it.name)}">×</span></div>`).join('');
}
async function savePrices() {
  try {
    const d = await (await fetch('/api/prices', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: priceItems }) })).json();
    priceItems = d.items || priceItems;
  } catch (e) {}
  renderPrices();
}
function addPrice() {
  const name = $('priceName').value.trim();
  const val = $('priceValue').value.trim();
  if (!name) { toast('先填食材名'); return; }
  const unit = $('priceUnit').value;
  const price = val ? parseFloat(val) : null;
  const i = priceItems.findIndex(x => x.name === name);
  if (i >= 0) priceItems[i] = { name, price, unit };
  else priceItems.push({ name, price, unit });
  $('priceName').value = ''; $('priceValue').value = '';
  savePrices();
}

/* ---------- 搜菜 / 加菜 ---------- */
let searchTimer = null;
function doSearch(q) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    q = q.trim();
    if (!q) { $('searchResults').innerHTML = ''; return; }
    try {
      const d = await (await fetch('/api/recipes/search?q=' + encodeURIComponent(q))).json();
      $('searchResults').innerHTML = (d.results || []).map(r => {
        const fav = favorites.some(f => f.id === r.id);
        return `<div class="market-result" data-id="${esc(r.id)}"><span class="m-name">${esc(r.name)}</span><span class="m-type">${esc(r.dish_type || '')}</span><span class="m-fav${fav ? ' on' : ''}" data-id="${esc(r.id)}" data-name="${esc(r.name)}">${fav ? '⭐' : '☆'}</span></div>`;
      }).join('') || '<div class="market-fav">没搜到</div>';
    } catch (e) { $('searchResults').innerHTML = '<div class="market-fav">搜索失败</div>'; }
  }, 250);
}

async function addRecipe() {
  const name = $('addName').value.trim();
  if (!name) { toast('先填菜名'); return; }
  const body = {
    name, dish_type: $('addType').value,
    ingredients: $('addIngredients').value.trim(),
    steps: $('addSteps').value.trim(),
    difficulty: +($('addDifficulty').value) || 0,
    estimated_minutes: +($('addMinutes').value) || 0,
  };
  try {
    const d = await (await fetch('/api/recipes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
    if (d.ok) {
      toast('已加入菜谱：' + d.recipe.name);
      $('addName').value = ''; $('addIngredients').value = ''; $('addSteps').value = '';
      $('addDifficulty').value = ''; $('addMinutes').value = '';
      $('addRecipeModal').classList.add('hidden');
    } else { toast(d.error || '添加失败'); }
  } catch (e) { toast('添加失败：' + e.message); }
}

/* ---------- 事件绑定 ---------- */
$('tasteChips').addEventListener('click', e => { const c = e.target.closest('.chip[data-taste]'); if (c) toggleTaste(c.dataset.taste); });
$('prefTasteChips').addEventListener('click', e => { const c = e.target.closest('.chip[data-taste]'); if (c) toggleTaste(c.dataset.taste); });
$('dislikeAdd').onclick = addDislike;
$('dislikeInput').addEventListener('keydown', e => { if (e.key === 'Enter') addDislike(); });
$('dislikeChips').addEventListener('click', e => {
  const d = e.target.closest('.pf-del');
  if (d) { dislikes = dislikes.filter(x => x !== d.dataset.x); try { localStorage.setItem('dislikes', JSON.stringify(dislikes)); } catch (e) {} renderDislikes(); }
});
$('pantryAdd').onclick = addPantry;
$('pantryInput').addEventListener('keydown', e => { if (e.key === 'Enter') addPantry(); });
$('pantryChips').addEventListener('click', e => {
  const del = e.target.closest('.pf-del');
  if (del) {
    pantryItems = pantryItems.filter(x => x !== del.dataset.x);
    fetch('/api/pantry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: pantryItems }) });
    renderPantry();
  }
});
$('favList').addEventListener('click', e => {
  const del = e.target.closest('.f-del');
  if (del) { toggleFav(del.dataset.id); return; }
  const nm = e.target.closest('.f-name');
  if (nm) openRecipe(nm.dataset.id);
});
$('priceAdd').onclick = addPrice;
$('priceList').addEventListener('click', e => {
  const del = e.target.closest('.p-del');
  if (del) { priceItems = priceItems.filter(x => x.name !== del.dataset.name); savePrices(); return; }
  const ed = e.target.closest('.p-edit');
  if (ed) {
    const it = priceItems.find(x => x.name === ed.dataset.name);
    if (it) { $('priceName').value = it.name; $('priceValue').value = it.price != null ? it.price : ''; $('priceUnit').value = it.unit || '元/斤'; }
  }
});
$('searchToggle').onclick = () => { $('searchModal').classList.remove('hidden'); };
$('searchModalClose').onclick = () => $('searchModal').classList.add('hidden');
$('searchModal').addEventListener('click', e => { if (e.target === $('searchModal')) $('searchModal').classList.add('hidden'); });
$('searchInput').addEventListener('input', e => doSearch(e.target.value));
$('addRecipeToggle').onclick = () => { $('addRecipeModal').classList.remove('hidden'); };
$('addRecipeModalClose').onclick = () => $('addRecipeModal').classList.add('hidden');
$('addRecipeModal').addEventListener('click', e => { if (e.target === $('addRecipeModal')) $('addRecipeModal').classList.add('hidden'); });
$('addSubmit').onclick = addRecipe;
$('searchResults').addEventListener('click', e => {
  const fb = e.target.closest('.m-fav');
  if (fb) {
    toggleFav(fb.dataset.id, fb.dataset.name);
    const on = favorites.some(f => f.id === fb.dataset.id);
    fb.textContent = on ? '⭐' : '☆';
    fb.classList.toggle('on', on);
    return;
  }
  const r = e.target.closest('.market-result');
  if (r) openRecipe(r.dataset.id);
});

/* ---------- LLM 设置 ---------- */
/* Key 只以脱敏形式出现在页面上；用户不改动时不会覆盖服务端已存的 Key。 */
const MASK_MARK = '****';
function isMasked(v) { return String(v || '').includes(MASK_MARK); }

async function loadLlmConfig() {
  try {
    const c = await (await fetch('/api/settings')).json();
    $('llmBaseUrl').value = c.base_url || '';
    $('llmApiKey').value = c.api_key || '';
    $('llmModel').value = c.model || '';
    updateLlmHint(c);
  } catch (e) { updateLlmHint(null); }
}

function updateLlmHint(c) {
  const el = $('llmHint');
  if (!c || !c.has_api_key) {
    el.textContent = '未配置 LLM：搭配说明、家常简化版会用模板/不可用，其他功能完全不受影响（规则引擎自带推荐理由）。';
  } else if (!c.configured) {
    el.textContent = '已存 API Key，但 Base URL / 模型没填全，还调用不了。';
  } else {
    el.textContent = `已配置：${c.base_url} / ${c.model}（Key 已脱敏，页面不显示明文）。`;
  }
}

async function saveLlmConfig() {
  const btn = $('llmSave');
  btn.disabled = true;
  try {
    const d = await postJSON('/api/settings', {
      base_url: $('llmBaseUrl').value.trim(),
      api_key: $('llmApiKey').value.trim(),
      model: $('llmModel').value.trim(),
    });
    $('llmStatus').textContent = '已保存';
    $('llmStatus').style.color = 'var(--accent)';
    // 服务端回传的是脱敏配置，用它刷新输入框
    if (d.config) {
      $('llmApiKey').value = d.config.api_key || '';
      updateLlmHint(d.config);
    }
  } catch (e) {
    $('llmStatus').textContent = '保存失败：' + e.message;
    $('llmStatus').style.color = 'var(--t1)';
  } finally {
    btn.disabled = false;
  }
}

async function testLlm() {
  $('llmStatus').textContent = '测试中…';
  $('llmStatus').style.color = 'var(--t2)';
  const btn = $('llmTest');
  btn.disabled = true;
  try {
    const r = await postJSON('/api/llm/test', {
      base_url: $('llmBaseUrl').value.trim(),
      api_key: $('llmApiKey').value.trim(),
      model: $('llmModel').value.trim(),
    });
    $('llmStatus').textContent = r.ok ? ('✓ ' + r.message) : ('✗ ' + r.message);
    $('llmStatus').style.color = r.ok ? 'var(--accent)' : 'var(--t1)';
  } catch (e) {
    $('llmStatus').textContent = '✗ ' + e.message;
    $('llmStatus').style.color = 'var(--t1)';
  } finally {
    btn.disabled = false;
  }
}
$('llmSave').onclick = saveLlmConfig;
$('llmTest').onclick = testLlm;

/* ---------- 味觉画像（反馈沉淀的结果） ---------- */
async function loadProfile() {
  try { PROFILE = await (await fetch('/api/profile')).json(); }
  catch (e) { PROFILE = null; }
  renderProfile();
}

function renderProfile() {
  const el = $('profileBox');
  if (!el) return;
  const p = PROFILE || { count: 0 };
  if (!p.count) {
    el.innerHTML = '<div class="nutri-note">还没有反馈。生成方案后点菜品右下角的 👍/👎，我会记住你的口味，下次推荐时自动加权。</div>';
    return;
  }
  const list = (arr, cls) => (arr || []).length
    ? `<div class="chips">${arr.map(x => `<span class="pf-chip ${cls}">${esc(x.name)}${x.score > 1 ? ' ' + x.score : ''}</span>`).join('')}</div>`
    : '<span class="nutri-note">暂无</span>';
  el.innerHTML = `
    <div class="prefs-section"><div class="prefs-title">爱吃的菜</div>${list(p.top_dishes, '')}</div>
    <div class="prefs-section"><div class="prefs-title">偏好的口味</div>${list(p.top_tastes, '')}</div>
    <div class="prefs-section"><div class="prefs-title">常出现的食材</div>${list(p.top_ingredients, '')}</div>
    <div class="prefs-section"><div class="prefs-title">不太喜欢的食材</div>${list(p.avoid_ingredients, 'avoid')}</div>
    <div class="nutri-note">共 ${p.count} 条反馈（存在本地 data/profile.json，只影响推荐概率，不会突破忌口/过敏等硬约束）。</div>`;
}

/* ---------- 初始化 ---------- */
bindCounter('peopleCounter', 1, 20);
bindCounter('dishCounter', 0, 10);
bindCounter('soupCounter', 0, 5);
bindCounter('dayCounter', 3, 14);
loadMeta();
loadLlmConfig();
loadPantry();
loadPrices();
loadProfile();
renderFavorites();
</script>
</body>
